paths:
  data_dir: data
  models_dir: models
  outputs_dir: outputs
  cache_dir: data/processed/cache
runtime:
  device: cpu
  random_seed: 42
  render_dpi: 150
  max_render_pixels: 30000000
  log_level: INFO
ingestion:
  min_native_characters: 20
  min_text_density: 0.00005
  enable_ocr: false
  ocr_engine: tesseract
boundary:
  # decision: expected_count uses the calibrated probabilities' sum as the expected number of
  # boundaries per packet, so it adapts to packets far denser or sparser than the training corpus.
  # Measured on the DocSplit benchmark: page grouping accuracy 0.615 vs 0.216 for a fixed
  # threshold, at a cost of 0.012 on OpenPSS. Set to "threshold" to use boundary.threshold.
  decision: expected_count
  threshold: 0.6334265856848469
  calibration: true
  model_path: models/boundary_openpss
classification:
  model_kind: tfidf_logistic_regression
  min_confidence: 0.35
  model_path: models/document_classifier/tfidf_lr.pkl
chunking:
  max_tokens: 256
  overlap_tokens: 32
retrieval:
  top_k: 5
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  # Measured on data/samples/retrieval_queries.json (35 queries, 2.6k-chunk corpus):
  #   rrf_hashed  R@1 0.257   <- previous default; WORSE than bm25 alone (0.714)
  #   rrf_svd + rerank  R@1 0.771  MRR 0.821   index 7.5s   no heavy dependency
  #   rrf_bge  + rerank  R@1 0.886  MRR 0.929   index 67s    requires torch (~1GB)
  # Defaulting to svd: it needs nothing beyond requirements.txt, so the pipeline reproduces
  # anywhere. Set encoder: transformer for the best scores when torch is available.
  rerank: true
  encoder: svd
  # MMR diversity. Measured: 0.7 keeps R@1 at 0.771 while lifting R@5 0.886 -> 0.914 and
  # distinct documents in the top 5 from 1.74 to 2.09, eliminating duplicate context chunks.
  mmr_lambda: 0.7
  context_token_budget: 1500
  embedding_model: BAAI/bge-small-en-v1.5

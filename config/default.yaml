paths:
  data_dir: data
  models_dir: models
  outputs_dir: outputs
  cache_dir: data/processed/cache
runtime:
  device: cpu
  random_seed: 42
  render_dpi: 150
  max_render_pixels: 30000000
  log_level: INFO
ingestion:
  min_native_characters: 20
  min_text_density: 0.00005
  enable_ocr: false
  ocr_engine: tesseract
boundary:
  # How per-seam probabilities become splits. Two rules are implemented in stage1/grouping.py:
  #   threshold      -- split wherever probability >= boundary.threshold.
  #   expected_count -- K = round(sum of probabilities), split at the K highest-scoring seams.
  #                     Parameter-free and density-adaptive, but must commit to exactly K, so it
  #                     drops a confident seam ranked K+1 and promotes a weak one ranked K.
  #
  # Selected by sweeping on the TABME++ validation split (510 packets) on page grouping accuracy,
  # freezing the value, then evaluating once on the held-out test split (501 packets, 2,284 seams,
  # 56.3% density). Held-out test result, English model:
  #   expected_count            grouping 0.9570  F1 0.935  recall 0.930  lift +0.215
  #   threshold 0.185011        grouping 0.9682  F1 0.942  recall 0.991  lift +0.222
  #   difference +0.0112, 95% bootstrap CI [+0.0040, +0.0192] -- significant, and it transferred.
  #
  # THE THRESHOLD BELONGS TO models/boundary_tabme. It is a property of that model's calibrated
  # score distribution, not a general setting: the previous value, 0.6334, was fitted for
  # models/boundary_shortpackets and scores 0.9516 here. Retune after changing the model, or
  # switch decision to expected_count, which needs no tuning.
  #
  # For Dutch (models/boundary_shortpackets) use expected_count: on held-out OpenPSS it scores
  # 0.7179 grouping against 0.6915 for a threshold tuned the same way, which overfitted its
  # validation half (+0.068) and failed to transfer (-0.027).
  decision: threshold
  threshold: 0.185011
  calibration: true
  # Trained on TABME++ (English, 504 packets / 2,269 pairs, real per-word geometry). The previous
  # default, models/boundary_shortpackets, was trained on OpenPSS -- which is Dutch (Amsterdam
  # municipal letters), so its TF-IDF vocabulary recognises only ~28% of the tokens in an English
  # packet and its strongest text feature was running on mostly out-of-vocabulary input.
  # Measured on the held-out TABME++ validation split (510 packets, 2,239 seams, 58.2% density):
  #   models/boundary_shortpackets (Dutch)   F1 0.481  recall 0.342  grouping 0.518  lift -0.255
  #   models/boundary_tabme        (English) F1 0.925  recall 0.911  grouping 0.947  lift +0.188
  # Switch back to models/boundary_shortpackets for Dutch documents: it scores 0.761 grouping on
  # the OpenPSS held-out set against 0.606 for this model. The choice is a language choice.
  model_path: models/boundary_tabme
classification:
  model_kind: tfidf_logistic_regression
  min_confidence: 0.35
  # Word 1-2 grams unioned with character 3-5 grams, trained on 21,788 RVL-CDIP documents.
  # The corpus is OCR of scanned pages, so a word-only vocabulary fails exactly where it matters:
  # "Invoice" misread as "lnvoice" is out of vocabulary and its evidence is lost, while most
  # character n-grams survive a one-character error.
  # Selected on validation, scored once on a held-out test split of 5,447 documents:
  #   word only              accuracy 0.8153  macro-F1 0.7932
  #   word + char (shipped)  accuracy 0.8388  macro-F1 0.8198
  # A third variant adding 21 page-geometry features led validation by +0.0155 macro-F1 and did
  # not transfer: on test it lost by 0.0019, McNemar p=0.345 over 5,447 documents. It is not
  # shipped. See outputs/benchmarks/classification_ablation.json.
  model_path: models/document_classifier/tfidf_char_lr.pkl
chunking:
  max_tokens: 256
  overlap_tokens: 32
retrieval:
  top_k: 5
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  # Measured on data/samples/retrieval_queries.json (35 queries, 2.6k-chunk corpus):
  #   rrf_hashed  R@1 0.257   <- previous default; WORSE than bm25 alone (0.714)
  #   rrf_svd + rerank  R@1 0.771  MRR 0.821   index 7.5s   no heavy dependency
  #   rrf_bge  + rerank  R@1 0.886  MRR 0.929   index 67s    requires torch (~1GB)
  # Defaulting to svd: it needs nothing beyond requirements.txt, so the pipeline reproduces
  # anywhere. Set encoder: transformer for the best scores when torch is available.
  rerank: true
  encoder: svd
  # MMR diversity. Measured: 0.7 keeps R@1 at 0.771 while lifting R@5 0.886 -> 0.914 and
  # distinct documents in the top 5 from 1.74 to 2.09, eliminating duplicate context chunks.
  mmr_lambda: 0.7
  context_token_budget: 1500
  embedding_model: BAAI/bge-small-en-v1.5
